[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AH-GNO"
version = "0.1.0"
description = "AH-GNO for morphodynamic prediction and TELEMAC coupling"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.5",
  "neuraloperator>=1.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
